<!-- LOGIN SPLIT SCREEN -->
<div class="login-root">

  <!-- LEFT PANEL — brand / visual -->
  <div class="login-left">
    <div class="login-left-inner">
      <!-- Real Envision Logo -->
      <div class="login-logo-wrap">
        <img src="assets/envision-logo-dark.png" alt="Envision" class="logo-img" width="200px"/>
      </div>

      <div class="login-tagline">
        <h1>Project Management</h1>
        <p>Plan, track and submit yearly demand data for your wind turbine projects — all in one place.</p>
      </div>

      <!-- Decorative cards -->
      <div class="login-deco-cards">
        <!-- <div class="deco-card">
          <div class="deco-icon">⚡</div>
          <div>
            <div class="deco-label">Active Projects</div>
            <div class="deco-val">24 Projects</div>
          </div>
        </div>
        <div class="deco-card">
          <div class="deco-icon">🌬️</div>
          <div>
            <div class="deco-label">Turbines Planned</div>
            <div class="deco-val">1,280 WTGs</div>
          </div>
        </div> -->
        <div class="deco-card">
          <div class="deco-icon">📊</div>
          <div>
            <div class="deco-label">Demand Plans</div>
            <div class="deco-val">FY 2025–2028</div>
          </div>
        </div>
      </div>
    </div>
    <div class="deco-circle deco-circle-1"></div>
    <div class="deco-circle deco-circle-2"></div>
  </div>

  <!-- RIGHT PANEL — login form -->
  <div class="login-right">
    <div class="login-form-wrap">

      <!-- Mobile logo -->
      <div class="login-mobile-logo">
        <img src="assets/envision-logo.png" alt="Envision" class="login-mobile-logo-img" />
      </div>

      <div class="login-form-header">
        <h2>Welcome back</h2>
        <p>Sign in to your account to continue</p>
      </div>

      <form class="login-form" (ngSubmit)="onSubmit()" novalidate>

        <div class="login-error" *ngIf="error">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {{ error }}
        </div>

        <div class="form-field">
          <label for="username">Username</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <!-- <input type="text" pInputText placeholder="Enter your email" [(ngModel)]="username" /> -->
            <input id="username" type="text" placeholder="Enter your username"
              [(ngModel)]="username" name="username" autocomplete="username" [class.has-error]="error" />
          </div>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <input id="password" [type]="showPassword ? 'text' : 'password'" placeholder="Enter your password"
              [(ngModel)]="password" name="password" autocomplete="current-password" [class.has-error]="error" />
            <button type="button" class="pwd-toggle" (click)="togglePassword()" tabindex="-1">
              <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" [class.loading]="loading" [disabled]="loading">
          <span *ngIf="!loading">Sign In</span>
          <span *ngIf="loading" class="spinner-wrap">
            <span class="spinner"></span> Signing in...
          </span>
        </button>

      </form>

      <div class="login-footer-note">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
        Secured portal — authorized personnel only
      </div>
    </div>
  </div>

</div>
