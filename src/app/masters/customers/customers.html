<div class="card">
    <div class="customer-header">
        <h2>Customers</h2>
        <p-button icon="pi pi-plus" label="Add Customer" routerLink="/customers/add" />
    </div>
    <div class="custom-container">
        <p-table [value]="customerList" [rowHover]="true" [tableStyle]="{ 'min-width': 'max-content' }">
            <ng-template #header>
                <tr>
                    <th>SL No</th>
                    <th>Customer Code</th>
                    <th>Customer Name</th>
                    <th>Action</th>
                </tr>
            </ng-template>
            <ng-template #body let-customer let-i="rowIndex">
                <tr>
                    <td>{{ i + 1 }}</td>
                    <td>{{ customer.customerCode }}</td>
                    <td>{{ customer.customerName }}</td>
                    <td>
                        <p-menu #menu [model]="items" [popup]="true" appendTo="body" />
                        <button pButton pRipple text rounded severity="secondary" type="button" (click)="menu.toggle($event)">
                            <i pButtonIcon>
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="text-gray-500">
                                    <rect width="24" height="24" fill="none" />
                                    <path fill="currentColor"
                                        d="M12 7a2 2 0 1 0-2-2a2 2 0 0 0 2 2m0 10a2 2 0 1 0 2 2a2 2 0 0 0-2-2m0-7a2 2 0 1 0 2 2a2 2 0 0 0-2-2" />
                                </svg>
                            </i>
                        </button>
                    </td>
                </tr>
            </ng-template>
            <ng-template #emptymessage>
                <tr>
                    <td colspan="100%" style="text-align: center; padding: 1rem 0;">No Records Found</td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
