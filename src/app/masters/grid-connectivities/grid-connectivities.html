<div class="card">
    <div class="grid-header">
        <h2>Grid Connectivities</h2>
        <p-button icon="pi pi-plus" label="Add Grid Connectivity" (onClick)="openGridConnectivityModal()" />
    </div>
    <div class="custom-container">
        <p-table [value]="gridConnectivityList" [rowHover]="true" [tableStyle]="{ 'min-width': 'max-content' }">
            <ng-template #header>
                <tr>
                    <th>SL No</th>
                    <th>Grid Connectivity</th>
                    <th>Action</th>
                </tr>
            </ng-template>
            <ng-template #body let-grid let-i="rowIndex">
                <tr>
                    <td>{{ i + 1 }}</td>
                    <td>{{ grid.gridConnectivityName }}</td>
                    <td>
                        <p-menu #menu [model]="items" [popup]="true" appendTo="body" />
                        <button pButton pRipple text rounded severity="secondary" type="button" (click)="menu.toggle($event)">
                            <i pButtonIcon>
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="text-gray-500">
                                    <rect width="24" height="24" fill="none" />
                                    <path fill="currentColor"
                                        d="M12 7a2 2 0 1 0-2-2a2 2 0 0 0 2 2m0 10a2 2 0 1 0 2 2a2 2 0 0 0-2-2m0-7a2 2 0 1 0 2 2a2 2 0 0 0-2-2" />
                                </svg>
                            </i>
                        </button>
                    </td>
                </tr>
            </ng-template>
            <ng-template #emptymessage>
                <tr>
                    <td colspan="100%" style="text-align: center; padding: 1rem 0;">No Records Found</td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>

<p-dialog header="Add Grid Connectivity" [modal]="true" [(visible)]="showConnectivityModal" [style]="{ width: '30rem' }"
    [draggable]="false">
    <form>
        <div class="form-grid">
            <div class="form-field">
                <label for="grid-connectivity">Grid Connectivity</label>
                <input type="text" pInputText class="w-full" id="grid-connectivity" />
            </div>
        </div>
        <div class="submit-btn">
            <button pButton pRipple type="submit">Submit</button>
        </div>
    </form>
</p-dialog>

<p-toast />
<p-confirmdialog />
