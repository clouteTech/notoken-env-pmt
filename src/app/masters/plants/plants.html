<div class="card">
    <div class="plant-header">
        <h2>Plants</h2>
        <p-button icon="pi pi-plus" label="Add Plant" (onClick)="openPlantModal()" />
    </div>
    <div class="custom-container">
        <p-table [value]="plantList" [rowHover]="true" [tableStyle]="{ 'min-width': 'max-content' }">
            <ng-template #header>
                <tr>
                    <th>SL No</th>
                    <th>Plant Name</th>
                    <th>Location</th>
                    <th>Plant Manager</th>
                    <th>Action</th>
                </tr>
            </ng-template>
            <ng-template #body let-plant let-i="rowIndex">
                <tr>
                    <td>{{ i + 1 }}</td>
                    <td>{{ plant.plantName }}</td>
                    <td>{{ plant.location }}</td>
                    <td>{{ plant.plantManager }}</td>
                    <td>
                        <p-menu #menu [model]="items" [popup]="true" appendTo="body" />
                        <button pButton pRipple text rounded severity="secondary" type="button" (click)="menu.toggle($event)">
                            <i pButtonIcon>
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="text-gray-500">
                                    <rect width="24" height="24" fill="none" />
                                    <path fill="currentColor"
                                        d="M12 7a2 2 0 1 0-2-2a2 2 0 0 0 2 2m0 10a2 2 0 1 0 2 2a2 2 0 0 0-2-2m0-7a2 2 0 1 0 2 2a2 2 0 0 0-2-2" />
                                </svg>
                            </i>
                        </button>
                    </td>
                </tr>
            </ng-template>
            <ng-template #emptymessage>
                <tr>
                    <td colspan="100%" style="text-align: center; padding: 1rem 0;">No Records Found</td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>

<p-dialog header="Add Plant" [modal]="true" [(visible)]="showPlantModal" [style]="{ width: '40rem' }"
    [draggable]="false">
    <form>
        <div class="form-grid">
            <div class="form-field">
                <label for="plant-name">Plant</label>
                <input type="text" pInputText id="plant-name" />
            </div>
            <div class="form-field">
                <label for="location">Location</label>
                <input type="text" pInputText id="location" />
            </div>
            <div class="form-field">
                <label for="plant-manager">Plant Manager</label>
                <p-select [options]="plantManagerList" optionLabel="label" inputId="near-shore" placeholder="Select Plant Manager" 
                    appendTo="body" [filter]="true" filterBy="label" />
            </div>
        </div>
        <div class="submit-btn">
            <button pButton pRipple type="submit">Submit</button>
        </div>
    </form>
</p-dialog>

<p-toast />
<p-confirmdialog />
