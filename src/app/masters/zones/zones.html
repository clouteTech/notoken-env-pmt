<div class="card">
    <div class="zone-header">
        <h2>Zones</h2>
        <p-button icon="pi pi-plus" label="Create Zone" (onClick)="openZoneModal()" />
    </div>
    <div class="custom-container">
        <p-table [value]="zoneList" [rowHover]="true" [tableStyle]="{ 'min-width': 'max-content' }">
            <ng-template #header>
                <tr>
                    <th>SL No</th>
                    <th>Zone</th>
                </tr>
            </ng-template>
            <ng-template #body let-zone let-i="rowIndex">
                <tr>
                    <td>{{ i + 1 }}</td>
                    <td>{{ zone.zoneName }}</td>
                </tr>
            </ng-template>
            <ng-template #emptymessage>
                <tr>
                    <td colspan="100%" style="text-align: center; padding: 1rem 0;">No Records Found</td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>

<p-dialog header="Create Zone" [modal]="true" [(visible)]="showZoneModal" [style]="{ width: '30rem' }"
    [draggable]="false">
    <form>
        <div class="form-grid">
            <div class="form-field">
                <label for="zone">Zone</label>
                <input type="text" pInputText class="w-full" id="zone" />
            </div>
        </div>
        <div class="create-btn">
            <button pButton pRipple type="submit">Create</button>
        </div>
    </form>
</p-dialog>
