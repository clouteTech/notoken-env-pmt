<div class="card">
    <div class="dispatch-header">
        <h2>WTG Dispatch</h2>
        <p-button label="Plan Dispatch" icon="pi pi-truck" routerLink="/wtg-dispatch/plan" />
    </div>
    <div class="custom-container">
        <p-table [value]="wtgDispatchPlanList" [rowHover]="true" [tableStyle]="{ 'min-width': 'max-content' }">
            <ng-template #header>
                <tr>
                    <th>SL NO</th>
                    <th>Plan Date</th>
                    <th>Project Code</th>
                    <th>WTG Count</th>
                    <th>Action</th>
                </tr>
            </ng-template>
            <ng-template #body let-dispatch let-i="rowIndex">
                <tr>
                    <td>{{ i + 1 }}</td>
                    <td>{{ dispatch.planDate }}</td>
                    <td>{{ dispatch.projectCode }}</td>
                    <td>{{ dispatch.wtgCount }}</td>
                    <td>
                        <p-menu #menu [model]="items" [popup]="true" appendTo="body" />
                        <button pButton pRipple text rounded severity="secondary" type="button" (click)="dispatchMenu($event, menu, dispatch)">
                            <i pButtonIcon>
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="text-gray-500">
                                    <rect width="24" height="24" fill="none" />
                                    <path fill="currentColor"
                                        d="M12 7a2 2 0 1 0-2-2a2 2 0 0 0 2 2m0 10a2 2 0 1 0 2 2a2 2 0 0 0-2-2m0-7a2 2 0 1 0 2 2a2 2 0 0 0-2-2" />
                                </svg>
                            </i>
                        </button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
