<div class="card">
    <h2>Project Summary</h2>
    <div class="custom-container">
        <p-table [value]="wtgProjects" [rowHover]="true" [tableStyle]="{ 'min-width': 'max-content' }">
            <ng-template #header>
                <tr>
                    <th>SL NO</th>
                    <th>Open WTG</th>
                    <th>Project Code</th>
                    <th>Project Name</th>
                    <th>WTG Count</th>
                </tr>
            </ng-template>
            <ng-template #body let-receiving let-i="rowIndex">
                <tr>
                    <td>{{ i + 1 }}</td>
                    <td>
                        <button class="open-wtg-btn" routerLink="/wtg-receiving/view">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                                <polyline points="15 3 21 3 21 9" />
                                <line x1="10" y1="14" x2="21" y2="3" />
                            </svg>
                            Open WTG
                        </button>
                    </td>
                    <td>{{ receiving.projectCode }}</td>
                    <td>{{ receiving.projectName }}</td>
                    <td>{{ receiving.wtgCount }}</td>
                </tr>
            </ng-template>
            <ng-template #emptymessage>
                <tr>
                    <td colspan="100%" style="text-align: center; padding: 1rem 0;">No Records Found</td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
